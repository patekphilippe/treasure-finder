# Backend for AI analysis of historical sources (docs/BACKEND.md).
# The app works without it; this only takes submissions and runs the AI pipeline.
name = "treasure-finder-api"
main = "src/index.ts"
compatibility_date = "2026-08-15"

[vars]
# where the PWA is served from (CORS)
ALLOWED_ORIGINS = "https://patekphilippe.github.io,http://localhost:5173,http://127.0.0.1:5199"
# hard monthly stop for Anthropic spending
MONTHLY_BUDGET_USD = "5"
# private analyses per member a day
PRIVATE_DAILY_LIMIT = "5"
# Test phase: sources an admin (ADMIN_EMAILS) shares go to the shared base right after the
# analysis, without the review in #admin. "false": reviewed like everyone else's.
ADMIN_AUTO_PUBLISH = "true"
# Community sign-in (docs/BACKEND.md, "Logowanie"): the Auth0 tenant and this API's identifier.
# Empty domain: nobody can sign in, the community, the panel and the analyses are closed.
AUTH0_DOMAIN = "dev-7o7mrth2w4xw60zk.us.auth0.com"
AUTH0_AUDIENCE = "https://treasure-finder-api"

# Created once with `wrangler d1 create treasure-finder`; paste the id it prints.
[[d1_databases]]
binding = "DB"
database_name = "treasure-finder"
database_id = "f761f7ed-f593-4941-830f-c0ffb460c719"
migrations_dir = "migrations"

# Uploaded photos and texts (Workers KV: free plan without a card; R2 needs one). Private,
# deleted with the submission; the app sends images of at most 1568 px.
[[kv_namespaces]]
binding = "SOURCES"
id = "3166279fe80d435ebba9c23bc45b3b2a"

# Approved context packs and their index, served by the worker under /api/kontekst/.
[[kv_namespaces]]
binding = "CONTEXT"
id = "001e63b2a1454daea7674193dc9e463d"

# Rendered relief tiles (docs/BACKEND.md, "Cieniowanie"): each one rendered once for everyone.
[[r2_buckets]]
binding = "TILES"
bucket_name = "treasure-finder-tiles"

# every minute while the pipeline is being worked on (a run lock keeps runs from overlapping);
# back to "*/15 * * * *" once it settles
[triggers]
crons = ["* * * * *"]

# Secrets (wrangler secret put): ANTHROPIC_API_KEY, ADMIN_TOKEN, ADMIN_EMAILS,
# AUTH0_ACTION_SECRET
