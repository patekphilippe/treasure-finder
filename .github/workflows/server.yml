name: Backend (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/shared/lib/history/**'
      - 'src/shared/lib/georef/**'
      - 'src/shared/types/sources.ts'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Deploys only once the Cloudflare account is set up (docs/BACKEND.md).
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply treasure-finder --remote
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
