name: Deploy app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # optional override of the AI backend address (default in src/shared/config/backend.ts)
  VITE_SOURCES_API_URL: ${{ vars.SOURCES_API_URL }}
  # community sign-in (docs/BACKEND.md, "Logowanie"); defaults in src/shared/config/auth.ts
  VITE_AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
  VITE_AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test

      # the old address on GitHub Pages stays while data moves over (a banner points to treasurefinder.pl)
      - run: npm run build
        env:
          APP_BASE: /treasure-finder/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # treasurefinder.pl (docs/BACKEND.md, "Adres aplikacji"): the app from /, deployed whenever the
  # Cloudflare keys are there, like the backend (server.yml). A job of its own: its failure shows
  # as red without holding the old address back.
  site:
    needs: build
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: server
        run: npm ci && npm run deploy:site
